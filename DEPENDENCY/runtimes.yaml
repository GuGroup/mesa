version: 1

recipes:
  core:
    description: CPU/runtime-managed first-install stack; excludes CUDA, UMA, AdsorbDiff, qsub-dependent submission, and checkpoint-managed runtimes.
    runtimes:
      - mesa-general
      - paper-search-mcp
      - mesa-paper-search
      - mesa-modeling
      - mesa-manuscript

runtimes:
  mesa-general:
    kind: uv-project
    description: Lightweight common Python runtime for stdlib OpenAI wrappers, JSON/YAML utilities, and simple deterministic scripts.
    cwd: DEPENDENCY/general
    run_prefix: uv run
    install:
      - uv sync
    update:
      - uv sync --upgrade
    check_tools:
      - uv
      - python
    smoke:
      - uv run python -c "import dotenv, requests, yaml; print('mesa-general ok')"
    env_optional:
      - OPENAI_API_KEY
      - OPENAI_MODEL

  mesa-modeling:
    kind: conda-env
    description: Structure modeling runtime for slabuilder, ASE, pymatgen, RDKit, Materials Project access, and result analysis.
    cwd: ENVIRONMENT/build_tools
    spec: ENVIRONMENT/build_tools/environment.yml
    run_prefix: mamba run -n modeling
    install:
      - mamba env create -f environment.yml
    update:
      - mamba env update -f environment.yml --prune
    check_tools:
      - mamba
      - python
    smoke:
      - mamba run -n modeling python -c "import ase, pymatgen, rdkit, skimage, slabuilder; print('mesa-modeling ok')"
    env_optional:
      - MP_API_KEY
      - PMG_MAPI_KEY

  mesa-manuscript:
    kind: conda-env
    description: Manuscript, figure, document export, Pandoc, and publication plotting runtime.
    cwd: ENVIRONMENT/manuscript_tools
    spec: ENVIRONMENT/manuscript_tools/environment.yml
    run_prefix: mamba run -n mesa-manuscript
    install:
      - mamba env create -f environment.yml
    update:
      - mamba env update -f environment.yml --prune
    check_tools:
      - mamba
      - python
      - pandoc
    smoke:
      - mamba run -n mesa-manuscript python -c "import numpy, scipy, matplotlib, ase; print('mesa-manuscript ok')"

  mesa-paper-search:
    kind: uv-project
    description: Local SearchAgent LangGraph and PaperQA literature workflow runtime.
    cwd: ENVIRONMENT/paper_search
    spec: ENVIRONMENT/paper_search/pyproject.toml
    lock: ENVIRONMENT/paper_search/uv.lock
    run_prefix: uv run --frozen
    install:
      - uv sync --frozen --extra mcp --extra local-embeddings
    update:
      - uv sync --extra mcp --extra local-embeddings
    check_tools:
      - uv
      - python
    smoke:
      - uv run --frozen python -c "import paper_search, langgraph; print('mesa-paper-search ok')"
    env_optional:
      - PAPER_SEARCH_EMAIL
      - PAPER_SEARCH_PROVIDER
      - PAPER_SEARCH_MODEL
      - OPENAI_API_KEY
      - OPENAI_BASE_URL
      - OPENAI_EMBEDDING_KEY
      - ANTHROPIC_API_KEY
      - SEMANTIC_SCHOLAR_API_KEY
      - ELSEVIER_API_KEY
      - ELSEVIER_INSTTOKEN
      - PAPER_SEARCH_GROBID_URL
      - PAPER_SEARCH_GROBID_START_CMD
      - PAPER_SEARCH_OPENDATALOADER_CMD

  paper-search-mcp:
    kind: uv-project
    description: External paper-search MCP server/client runtime, kept separate from mesa-paper-search to avoid command and dependency collisions.
    cwd: EXTERNAL/paper-search-mcp
    spec: EXTERNAL/paper-search-mcp/pyproject.toml
    lock: EXTERNAL/paper-search-mcp/uv.lock
    run_prefix: uv run
    install:
      - uv sync --frozen
    update:
      - uv sync
    check_tools:
      - uv
      - python
    smoke:
      - uv run python -c "import paper_search_mcp; print('paper-search-mcp ok')"
    env_optional:
      - PAPER_SEARCH_MCP_UNPAYWALL_EMAIL
      - PAPER_SEARCH_MCP_CORE_API_KEY
      - PAPER_SEARCH_MCP_SEMANTIC_SCHOLAR_API_KEY
      - PAPER_SEARCH_MCP_GOOGLE_SCHOLAR_PROXY_URL
      - PAPER_SEARCH_MCP_DOAJ_API_KEY
      - PAPER_SEARCH_MCP_ZENODO_ACCESS_TOKEN
      - PAPER_SEARCH_MCP_OPENAIRE_API_KEY
      - PAPER_SEARCH_MCP_CITESEERX_API_KEY
      - PAPER_SEARCH_MCP_IEEE_API_KEY
      - PAPER_SEARCH_MCP_ACM_API_KEY

  mesa-vasp-submit:
    kind: uv-tool
    description: HPC login-node VASP job preparation/submission tool. Install as a uv tool, not as a shared project venv.
    cwd: ENVIRONMENT/vasp-submit-linker
    spec: ENVIRONMENT/vasp-submit-linker/pyproject.toml
    run_prefix: vasp-job
    install:
      - CFLAGS="${CFLAGS:-} -std=gnu99" uv tool install --python 3.11 --editable . --constraint constraints.txt --force
    update:
      - CFLAGS="${CFLAGS:-} -std=gnu99" uv tool install --python 3.11 --editable . --constraint constraints.txt --force
    check_tools:
      - uv
      - vasp-job
      - qsub
    smoke:
      - vasp-job schema
    env_optional:
      - VASP_SUBMIT_CONFIG_DIR

  mesa-uma:
    kind: external-manual
    description: FAIRChem/UMA runtime for MLIP single-point, relaxation trajectory, and finite-displacement vibration tasks.
    cwd: DEPENDENCY/uma
    spec: DEPENDENCY/uma/runtime.md
    environment_spec: ENVIRONMENT/fairchem/environment.yml
    run_prefix: mamba run -n fairchem
    install:
      - See DEPENDENCY/uma/runtime.md
    check_tools:
      - mamba
      - qsub
    smoke:
      - mamba run -n fairchem python -c "import ase; from fairchem.core import FAIRChemCalculator, pretrained_mlip; print('mesa-uma ok')"
    env_optional:
      - HF_TOKEN
      - HF_HOME
      - MESA_UMA_DEVICE
      - CUDA_VISIBLE_DEVICES

  mesa-adsorbdiff:
    kind: external-manual
    description: AdsorbDiff runtime for candidate adsorbate placement, diffusion sampling, LMDB conversion, and optional MLFF relaxation.
    cwd: DEPENDENCY/adsorbdiff
    spec: DEPENDENCY/adsorbdiff/runtime.md
    run_prefix: python
    install:
      - See DEPENDENCY/adsorbdiff/runtime.md
    check_tools:
      - python
    smoke:
      - python -c "import ase, lmdb, torch, yaml; print('mesa-adsorbdiff ok')"
    env_optional:
      - HF_TOKEN
      - HF_HOME
      - CUDA_VISIBLE_DEVICES

  no-runtime:
    kind: instruction-only
    description: Text-only or orchestration skills that do not own a Python runtime.
    run_prefix: none
    install:
      - No runtime install required.

skills:
  extract-data-from-experiment: mesa-general
  extract-strategy-paper: mesa-general
  extract-general-insights-paper: mesa-general
  generate-strategies: mesa-general
  select-next-strategy: mesa-general
  update-strategies-from-manuscript: mesa-general
  generate-explicit-calculation-recipe: mesa-general
  validate-recipe-execution: mesa-general
  record-missing-evidence: mesa-general
  balance-reaction-pathway: mesa-general
  evaluate-energy-diagram: mesa-general
  assemble-alkaline-her-descriptors: mesa-general
  analyze-dband-center: mesa-modeling
  charge-flow-analyzer: mesa-modeling
  build-slab-models: mesa-modeling
  build-gas-phase-models: mesa-modeling
  analyze-relaxation-results: mesa-modeling
  construct-energy-diagram: mesa-modeling
  place-adsorbates-with-adsorbdiff: mesa-adsorbdiff
  propose-surface-models-from-literature: mesa-paper-search
  search-papers-with-mcp: paper-search-mcp
  manage-vasp-jobs: mesa-vasp-submit
  relax-uma-trajectory: mesa-uma
  calculate-uma-vibrational-frequencies: mesa-uma
  plot-dos: mesa-modeling
  plot-energy-diagram: mesa-manuscript
  plot-sabatier-volcano: mesa-manuscript
  render-adsorbate-structure-grid: mesa-modeling
  create-nature-figure: mesa-manuscript
  map-strategy-figures: mesa-manuscript
  realize-strategy-figures: mesa-manuscript
  caption-strategy-figures: mesa-manuscript
  insert-strategy-figures-into-docx: mesa-manuscript
  collect-methods-evidence: mesa-manuscript
  write-methods-sections: mesa-manuscript
  collect-results-evidence: mesa-manuscript
  write-results-section: mesa-manuscript
  collect-introduction-evidence: mesa-manuscript
  write-introduction-section: mesa-manuscript
  extract-citation-sources: mesa-manuscript
  select-citations: mesa-manuscript
  insert-citations: mesa-manuscript
  insert-section-into-docx: mesa-manuscript
  write-title-abstract-keywords-conclusion: mesa-manuscript
  write-supporting-information: mesa-manuscript
  move-methods-details-to-si: mesa-manuscript
  resolve-manuscript-placeholders: mesa-manuscript
  polish-manuscript-references: mesa-manuscript
  polish-si-references: mesa-manuscript
  polish-manuscript-notation: mesa-manuscript
