# Shared mamba/conda env (`modeling`) for all .codex skills.
#
# slabuilder is vendored into this repo (./slabuilder), trimmed to just the
# modules the skills use, so installing this project editable provides the
# engine + its dependencies. No external slab_build checkout is needed.
#
#   mamba env create -f environment.yml           # first time
#   mamba env update -f environment.yml --prune   # after edits
#
# Dependency versions are declared in pyproject.toml (single source of truth).
# Optional extras: pip install -e ".[opsin]" (chemical-name resolution via
# OPSIN, also needs Java on PATH), ".[dev]" (tests).
#
# Visual result review (TASK_CALCULATION_RESULT_ANALYZER) renders aseview PNGs
# through a headless browser. aseview is an external sibling checkout at
# ../../../aseview (i.e. compchem/aseview); its [export] extra pulls playwright.
# Chromium itself is a one-time post-install download (not a pip package):
#
#   mamba env update -f environment.yml --prune                  # from this dir
#   mamba run -n modeling python -m playwright install chromium  # once, after
#
name: modeling

channels:
  - conda-forge

dependencies:
  - python=3.11
  - pip
  - pip:
      - -e .
      # aseview viewer + headless PNG/GIF export (playwright). External sibling
      # editable checkout; keep aseview cloned next to this repo.
      - -e ../../../aseview[export]
