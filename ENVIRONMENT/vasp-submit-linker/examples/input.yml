# Minimal DFT-test VASP job spec for vasp-job (run directly on the HPC login node).
#   vasp-job prepare input.yml   # write input files only, no qsub
#   vasp-job submit  input.yml   # write input files and submit with qsub
#
# vasp-job does NOT fill defaults: vasp.parameters is written explicitly and
# passed to vasp-ase as-is. For DFT tests, the agent assembles it from the
# skill's SKILL/calculation/manage-vasp-jobs/defaults.yaml profile.dft_test
# blocks plus task-specific and system-specific overrides.
# Run `vasp-job schema` for the accepted top-level fields.

schema_version: 1
job_name: si_bulk_001
task: bulk                 # label recorded in metadata (bulk|slab|freq|static)

# Optional project group. Files go under {root}/{project}/jobs/{job_uid}
# (or {root}/jobs/{job_uid} when null).
project: null

structure:
  format: poscar
  path: POSCAR              # relative to this input.yml file

# DFT-test default: explicit Gamma-only sampling. Omit kspacing/kgamma.
# vasp.parameters keys are lowercase vasp-ase keywords (not uppercase INCAR tags).
vasp:
  kpts: [1, 1, 1]
  gamma: true
  parameters:
    # profile.dft_test.common (from defaults.yaml)
    gga: PE
    prec: Low
    encut: 350
    ediff: 5.0e-4
    algo: Fast
    nelm: 80
    ismear: 0              # Si is a semiconductor → Gaussian smearing (default 1 is for metals)
    sigma: 0.05
    ispin: 1
    isym: 0
    lreal: Auto
    ncore: 4
    lcharg: false
    lwave: false
    # task.bulk
    ibrion: 2
    isif: 3
    nsw: 100
    ediffg: -8.0e-2
    potim: 0.1

queue:
  preset: presetg018gam    # g01, a6000.q, mpi_8; guarded to one active g01 job
