# VASP parameter defaults for the vasp-job skill (mesa-dft-test lightweight/fast protocol).
#
# vasp-job does NOT merge these — the agent does. To build a job's
# vasp.parameters: take `common`, overlay `task.<task>`, then apply any
# system-specific overrides, and write the result explicitly into the spec.
# Keys are lowercase vasp-ase keywords (not uppercase INCAR tags).
#
# This branch (mesa-dft-test) intentionally trades accuracy for speed across
# the board: a smaller ENCUT, the fastest PREC tier, looser EDIFF/EDIFFG,
# fewer NELM steps, and an explicit Gamma-only 1x1x1 k-point mesh (vasp_gam)
# instead of a KSPACING mesh. Use it for fast inference / smoke-testing the
# pipeline, not for production energetics. Every task overlay below inherits
# this loosened baseline unless a task's physics genuinely requires an override
# (e.g. `bulk` still needs `isif: 3` for cell relaxation) — do not re-tighten
# `ediff`/`algo`/`prec` per task "to be safe".

common:
  # --- Electronic ---
  gga: PE                 # PBE functional
  encut: 350
  prec: Low               # fastest PREC tier; coarser FFT grid, no exact Ewald
  ediff: 5.0e-4
  algo: Fast
  nelm: 80

  # --- Metallic catalyst ---
  ismear: 1               # see system-dependent notes below
  sigma: 0.20

  # --- Ionic relaxation (slab/adsorbate default; overridden per task below) ---
  ibrion: 2
  nsw: 100
  isif: 2
  ediffg: -0.08

  # --- Speed ---
  lreal: Auto
  ncore: 4

  # --- Slab / adsorbate ---
  isym: 0
  lasph: true
  addgrid: true

  # --- Output reduction ---
  lwave: false
  lcharg: false

task:
  bulk:   { isif: 3 }                                                # full cell relaxation
  slab:   {}                                                         # inherits common as-is
  # freq inherits common's ediff/algo (5.0e-4/Fast) like everything else on
  # this branch — do not tighten them back to production-grade values. See
  # SKILL.md "Frequency (freq) task" for the REQUIRED Selective Dynamics prep
  # (fix every slab atom, free only the adsorbate) before running this task.
  freq:   { ibrion: 5, nfree: 2, potim: 0.015, nsw: 1, isif: 0, isym: 0 }
  static: { ibrion: -1, nsw: 0 }                                     # inherits common's algo: Fast

# System-dependent — DECIDE per job, do not blindly copy `common`:
#   ismear / sigma
#     metal slab           -> ismear 1,  sigma 0.20   (Methfessel-Paxton, as above)
#     gas-phase molecule / -> ismear 0,  sigma 0.05   (Gaussian)
#       insulator
#   ispin / magmom
#     non-magnetic         -> ispin 1 (VASP default; omit ispin/magmom)
#     magnetic (Fe/Co/Ni/  -> ispin 2 + magmom (per-atom initial moments;
#       Mn/Cr/...)              REQUIRED when ispin 2)
#   k-points
#     default for this lightweight protocol is an explicit Gamma-only mesh:
#       vasp.kpts:  [1, 1, 1]
#       vasp.gamma: true
#     (omit kspacing/kgamma when using this fixed one-point mesh.) Use a denser
#     explicit vasp.kpts only when the system truly needs more sampling.
