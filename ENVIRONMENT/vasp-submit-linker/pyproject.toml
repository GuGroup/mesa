[project]
name = "vasp-submit"
version = "0.1.0"
description = "HPC-side helper for preparing, submitting, and tracking VASP jobs on an SGE login node."
requires-python = ">=3.10"
dependencies = [
    "ase>=3.23",
    "pyyaml>=6",
    "vasp-ase>=0.1",
]

[project.scripts]
vasp-job = "vasp_submit.hpc_server.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vasp_submit"]

[tool.hatch.build.targets.wheel.force-include]
"templates" = "vasp_submit/templates"
