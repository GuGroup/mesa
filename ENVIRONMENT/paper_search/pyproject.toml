[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paper-search"
version = "0.1.0"
description = "OA-only LangGraph literature agent for catalyst/material surface-modeling proposals."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "paper-search maintainers" }]
dependencies = [
  "curl-cffi>=0.7",
  "langchain-anthropic>=1.4.4",
  "langchain-community>=0.4.2",
  "langchain-core>=1.4.0",
  "langchain-openai>=1.2.2",
  "langgraph>=1.2.4",
  "omegaconf>=2.3",
  "opendataloader-pdf>=2.4",
  "paper-qa>=2026.3.18",
  "python-dotenv>=1.0",
  "tiktoken>=0.4,<0.12",
]

[project.optional-dependencies]
docs = [
  "mkdocs-material>=9.5",
  "mkdocs-static-i18n>=1.2",
]
local-embeddings = [
    "sentence-transformers>=3.0",
]
studio = [
    "langgraph-cli[inmem]>=0.2",
]
mcp = [
    "mcp>=1.2",
]
[project.scripts]
paper-search = "paper_search.cli:main"
paper-search-mcp = "paper_search.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_search"]
