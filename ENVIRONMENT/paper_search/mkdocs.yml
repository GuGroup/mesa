site_name: MESA Paper Search
site_description: LangGraph literature agent for catalyst and surface-modeling proposals.
repo_name: GuGroup/mesa
repo_url: https://github.com/GuGroup/mesa
edit_uri: edit/main/ENVIRONMENT/paper_search/docs/

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

nav:
  - Home: index.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
