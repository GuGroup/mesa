name: Weighted-alpha native integration

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/weighted-alpha-native.yml"
      - "ENVIRONMENT/build_tools/slabuilder/**"
      - "ENVIRONMENT/build_tools/tests/test_weighted_alpha_*.py"
      - "ENVIRONMENT/build_tools/tests/fixtures/weighted_alpha_ytk.POSCAR"
      - "ENVIRONMENT/build_tools/.codex/skills/inspect-surface-sites/**"
      - "ENVIRONMENT/build_tools/.codex/skills/place-surface-adsorbates/**"
      - "ENVIRONMENT/build_tools/WEIGHTED_ALPHA_BACKEND.md"
      - "ENVIRONMENT/build_tools/pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actual-binary-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}\ENVIRONMENT\build_tools
      MESA_WEIGHTED_ALPHA_CACHE: ${{ runner.temp }}\mesa-weighted-alpha-cache

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ENVIRONMENT/build_tools/pyproject.toml

      - name: Install minimal integration dependencies
        shell: pwsh
        run: |
          python -m pip install pytest==9.1.1 numpy==2.4.6 ase==3.29.0 pymatgen==2026.5.4 python-dotenv==1.2.2

      - name: Resolve pinned private runtime
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $modulePath = (Resolve-Path "ENVIRONMENT/build_tools/slabuilder/weighted_alpha_runtime.py").Path
          $runtimeJson = python -I -S -c 'import importlib.util,json,sys; p=sys.argv[1]; s=importlib.util.spec_from_file_location("weighted_alpha_runtime_standalone",p); m=importlib.util.module_from_spec(s); sys.modules[s.name]=m; s.loader.exec_module(m); r=m.resolve_first_party_runtime(); print(json.dumps({"exe":str(r.executable),"radius":str(r.radius_file),"manifest":str(r.runtime_manifest),"exe_sha":r.expected_executable_sha256,"radius_sha":r.expected_radius_sha256,"manifest_sha":r.expected_runtime_manifest_sha256,"release":r.release,"mesa_base_commit":r.mesa_base_commit,"private_source_manifest_sha256":r.private_source_manifest_sha256}))' $modulePath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $runtime = $runtimeJson | ConvertFrom-Json
          Add-Content -Path $env:GITHUB_ENV -Value "MESA_WEIGHTED_ALPHA_INTEGRATION_EXE=$($runtime.exe)"
          Add-Content -Path $env:GITHUB_ENV -Value "MESA_WEIGHTED_ALPHA_INTEGRATION_RADIUS_FILE=$($runtime.radius)"
          Add-Content -Path $env:GITHUB_ENV -Value "MESA_WEIGHTED_ALPHA_INTEGRATION_SLAB=$env:GITHUB_WORKSPACE\ENVIRONMENT\build_tools\tests\fixtures\weighted_alpha_ytk.POSCAR"
          Add-Content -Path $env:GITHUB_ENV -Value "MESA_WEIGHTED_ALPHA_INTEGRATION_SHA256=$($runtime.exe_sha)"
          Add-Content -Path $env:GITHUB_ENV -Value "MESA_WEIGHTED_ALPHA_INTEGRATION_RADIUS_SHA256=$($runtime.radius_sha)"
          Add-Content -Path $env:GITHUB_ENV -Value "MESA_WEIGHTED_ALPHA_INTEGRATION_RUNTIME_SHA256_MANIFEST=$($runtime.manifest)"
          Add-Content -Path $env:GITHUB_ENV -Value "MESA_WEIGHTED_ALPHA_INTEGRATION_RUNTIME_MANIFEST_SHA256=$($runtime.manifest_sha)"
          Add-Content -Path $env:GITHUB_ENV -Value "MESA_WEIGHTED_ALPHA_INTEGRATION_RELEASE=$($runtime.release)"
          Add-Content -Path $env:GITHUB_ENV -Value "MESA_WEIGHTED_ALPHA_INTEGRATION_MESA_BASE_COMMIT=$($runtime.mesa_base_commit)"
          Add-Content -Path $env:GITHUB_ENV -Value "MESA_WEIGHTED_ALPHA_INTEGRATION_PRIVATE_SOURCE_MANIFEST_SHA256=$($runtime.private_source_manifest_sha256)"

      - name: Run mandatory actual-binary YTK integration
        shell: pwsh
        run: |
          $required = @(
            "MESA_WEIGHTED_ALPHA_INTEGRATION_EXE",
            "MESA_WEIGHTED_ALPHA_INTEGRATION_RADIUS_FILE",
            "MESA_WEIGHTED_ALPHA_INTEGRATION_SLAB",
            "MESA_WEIGHTED_ALPHA_INTEGRATION_SHA256",
            "MESA_WEIGHTED_ALPHA_INTEGRATION_RADIUS_SHA256",
            "MESA_WEIGHTED_ALPHA_INTEGRATION_RUNTIME_SHA256_MANIFEST",
            "MESA_WEIGHTED_ALPHA_INTEGRATION_RUNTIME_MANIFEST_SHA256",
            "MESA_WEIGHTED_ALPHA_INTEGRATION_RELEASE",
            "MESA_WEIGHTED_ALPHA_INTEGRATION_MESA_BASE_COMMIT",
            "MESA_WEIGHTED_ALPHA_INTEGRATION_PRIVATE_SOURCE_MANIFEST_SHA256"
          )
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Required actual-binary integration variable is missing: $name"
            }
          }
          $report = Join-Path $env:RUNNER_TEMP "weighted-alpha-integration-junit.xml"
          $output = python -m pytest ENVIRONMENT/build_tools/tests/test_weighted_alpha_integration.py -q --junitxml=$report 2>&1
          $exitCode = $LASTEXITCODE
          $output | Write-Host
          if ($exitCode -ne 0) { exit $exitCode }
          [xml]$junit = Get-Content -Raw $report
          $suite = $junit.SelectSingleNode("//testsuite")
          if ($null -eq $suite -or [int]$suite.tests -ne 1 -or [int]$suite.failures -ne 0 -or [int]$suite.errors -ne 0 -or [int]$suite.skipped -ne 0) {
            throw "Actual-binary integration must execute exactly one non-skipped passing test"
          }
