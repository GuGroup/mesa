# Project-scoped Codex configuration for MESA.
#
# Codex loads this file only after the repository is trusted. Keep secrets out of
# this file; use DEPENDENCY/.env.example as the template for local .env values.

[mcp_servers.paper_search]
enabled = true
required = false
command = "uv"
args = ["run", "--frozen", "-m", "paper_search_mcp.server"]
cwd = "EXTERNAL/paper-search-mcp"
startup_timeout_sec = 30
tool_timeout_sec = 120
default_tools_approval_mode = "auto"

# The MCP server can read repository dependency secrets through this explicit path.
# Because cwd is EXTERNAL/paper-search-mcp, ../../DEPENDENCY/.env resolves to repo/DEPENDENCY/.env.
[mcp_servers.paper_search.env]
PAPER_SEARCH_MCP_ENV_FILE = "../../DEPENDENCY/.env"
