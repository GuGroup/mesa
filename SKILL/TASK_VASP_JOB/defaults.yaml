# VASP parameter defaults for the vasp-job skill (surface-catalysis protocol).
#
# vasp-job does NOT merge these — the agent does. To build a job's
# vasp.parameters: take `common`, overlay `task.<task>`, then apply any
# system-specific overrides, and write the result explicitly into the spec.
# Keys are lowercase vasp-ase keywords (not uppercase INCAR tags).

common:
  gga: RP                 # RPBE functional
  prec: Normal
  encut: 400
  ediff: 1.0e-4
  nelm: 1000
  ismear: 1               # see system-dependent notes below
  sigma: 0.1
  ispin: 1                # see system-dependent notes below
  ivdw: 12                # DFT-D3(BJ) — always on for surfaces
  isym: 0
  ncore: 8                # this cluster's standard
  lreal: Auto
  lcharg: false
  lwave: false
  kspacing: 0.30          # default k-point policy (Gamma-centered)
  kgamma: true

task:
  bulk:   { ibrion: 2, isif: 3, nsw: 1000, ediffg: -5.0e-2, potim: 0.1, algo: Fast }
  slab:   { ibrion: 2, isif: 0, nsw: 1000, ediffg: -5.0e-2, potim: 0.1, algo: Fast }
  freq:   { ibrion: 5, nfree: 2, potim: 0.015, nsw: 1, isif: 0, ediff: 1.0e-5, algo: Normal, isym: 0 }
  static: { ibrion: -1, nsw: 0, algo: Normal }

# System-dependent — DECIDE per job, do not blindly copy `common`:
#   ismear / sigma
#     metal slab           -> ismear 1,  sigma 0.1   (Methfessel-Paxton)
#     gas-phase molecule / -> ismear 0,  sigma 0.05  (Gaussian)
#       insulator
#   ispin / magmom
#     non-magnetic         -> ispin 1   (drop magmom)
#     magnetic (Fe/Co/Ni/  -> ispin 2 + magmom (per-atom initial moments;
#       Mn/Cr/...)              REQUIRED when ispin 2)
#   k-points
#     default is kspacing 0.30. Use an explicit vasp.kpts only when a fixed
#     mesh is needed (then omit kspacing/kgamma for that job).
