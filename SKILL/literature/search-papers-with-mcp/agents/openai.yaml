interface:
  display_name: "Search Papers With MCP"
  short_description: "Find claim-faithful catalyst literature"
  default_prompt: "Use $search-papers-with-mcp to search from the exact author-reported claim and return Domain Foundation, Computational Proof-Strategy, and Legacy Anchor papers without downloading PDFs."

dependencies:
  tools:
    - type: "mcp"
      value: "paper_search"
      description: "Academic paper metadata search tools exposed as mcp__paper_search; do not use download tools in this skill."

policy:
  allow_implicit_invocation: true
