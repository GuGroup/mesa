interface:
  display_name: "Search Papers With MCP"
  short_description: "Recommend catalyst papers without downloads"
  default_prompt: "Use $search-papers-with-mcp with target task and material domain to search metadata only, recommend Background, Computational Proof-Strategy, and Legacy Anchor papers, and create a manual-download queue."

dependencies:
  tools:
    - type: "mcp"
      value: "paper_search"
      description: "Academic paper metadata search tools exposed as mcp__paper_search; do not use download tools in this skill."

policy:
  allow_implicit_invocation: true
