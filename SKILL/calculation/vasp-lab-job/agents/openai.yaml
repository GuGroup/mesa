interface:
  display_name: "VASP Lab Job"
  short_description: "Generate ASE VASP inputs and submit SGE qsub jobs with lab scripts"
  default_prompt: >
    Use the vasp-lab-job skill for POSCAR/CONTCAR-based VASP input generation.
    Prefer executing scripts/make_vasp_inputs.py and the compatibility wrappers
    over writing Markdown-only recipes. Use references/defaults.yaml as the
    machine-readable source of lab fallback parameters, and use
    references/literature_parameters.yaml or user-provided paper profiles for
    literature-derived parameters. Submit validated inputs with qsub using the
    provided submit_vasp_*.sh templates; do not use queue: { preset: auto } or
    the legacy vasp-job YAML spec workflow unless explicitly requested.
