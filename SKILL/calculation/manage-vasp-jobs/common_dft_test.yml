# Reusable DFT-TEST common parameters for vasp-job `extends`.
#
# Use only for lightweight DFT test jobs on g01. This is not final-quality
# adsorption/surface-energy evidence.
#
# Usage:
#   vasp-job prepare spec.yml --common SKILL/calculation/manage-vasp-jobs/common_dft_test.yml
# or copy this file next to spec.yml and set:
#   extends: common_dft_test.yml
#
# Then add task params in the job spec, e.g. DFT-test slab:
#   vasp: { parameters: { ibrion: 2, isif: 2, nsw: 100, ediffg: -8.0e-2, potim: 0.1 } }
#   queue: { preset: presetg018gam }
#
# System-dependent overrides (set in the job spec when needed):
#   gas-phase molecule / insulator -> ismear: 0, sigma: 0.05
#   magnetic (Fe/Co/Ni/Mn/Cr/...)  -> ispin: 2 + magmom: [...] (REQUIRED when ispin 2)

vasp:
  kpts: [1, 1, 1]
  gamma: true
  parameters:
    gga: PE
    prec: Low
    encut: 350
    ediff: 5.0e-4
    algo: Fast
    nelm: 80
    ismear: 1
    sigma: 0.20
    ispin: 1
    isym: 0
    lreal: Auto
    ncore: 4
    lcharg: false
    lwave: false
