# VASP parameter defaults for the vasp-job skill (surface-catalysis protocol).
#
# vasp-job does NOT merge these — the agent does. To build a job's
# vasp.parameters for actual calculations: take top-level `common`, overlay
# top-level `task.<task>`, then apply system-specific overrides, and write the
# result explicitly into the spec.
# For explicitly requested quick screening/comparison jobs, start from the same
# top-level defaults, then overlay `profile.screening.common` and
# `profile.screening.task.<task>`.
# Keys are lowercase vasp-ase keywords (not uppercase INCAR tags).
#
# Top-level defaults are refinement-oriented actual-calculation defaults. They
# are the default once the workflow has selected a small candidate set for real
# VASP calculation. Screening must be requested explicitly.

common:
  gga: RP                 # RPBE functional
  prec: Normal
  encut: 400
  ediff: 1.0e-5
  nelm: 200
  ismear: 1               # see system-dependent notes below
  sigma: 0.1
  ispin: 1                # see system-dependent notes below
  ivdw: 12                # DFT-D3(BJ) — always on for surfaces
  isym: 0
  ncore: 8                # this cluster's standard
  lreal: Auto
  lcharg: false
  lwave: false
  kspacing: 0.30          # refinement default k-point policy (Gamma-centered)
  kgamma: true

task:
  bulk:   { ibrion: 2, isif: 3, nsw: 300, ediffg: -5.0e-2, potim: 0.1, algo: Fast }
  slab:   { ibrion: 2, isif: 0, nsw: 300, ediffg: -5.0e-2, potim: 0.1, algo: Fast }
  freq:   { ibrion: 5, nfree: 2, potim: 0.015, nsw: 1, isif: 0, ediff: 1.0e-6, algo: Normal, isym: 0 }
  static: { ibrion: -1, nsw: 0, ediff: 1.0e-6, algo: Normal }

profile:
  # Explicit DFT-test profile. Use when the user asks for this lightweight
  # DFT test path. This is deliberately not final-quality evidence:
  # one-point Gamma-only sampling is set at the job-spec vasp.kpts/gamma level
  # (not inside vasp.parameters), and kspacing/kgamma must be omitted.
  dft_test:
    vasp:
      kpts: [1, 1, 1]
      gamma: true
    common:
      gga: PE
      prec: Low
      encut: 350
      ediff: 5.0e-4
      algo: Fast
      nelm: 80
      ismear: 1
      sigma: 0.20
      ispin: 1
      isym: 0
      lreal: Auto
      ncore: 4
      lcharg: false
      lwave: false
    task:
      bulk:   { ibrion: 2, isif: 3, nsw: 100, ediffg: -8.0e-2, potim: 0.1 }
      slab:   { ibrion: 2, isif: 2, nsw: 100, ediffg: -8.0e-2, potim: 0.1 }
      static: { ibrion: -1, nsw: 0, ediff: 5.0e-4 }

  # Explicit quick-screening profile. Use only when the user asks for screening,
  # quick comparison, rough triage, or geometry sanity checks across candidates.
  # Do not use this as the default for actual submitted calculations.
  # k-point density (kspacing) is kept at the refinement value 0.30 on purpose:
  # screening saves cost through encut/ediff/nelm/nsw/ediffg, not by coarsening
  # k-points (0.45 was too coarse for metals).
  screening:
    common:
      encut: 350
      ediff: 1.0e-4
      nelm: 120
      kspacing: 0.30
    task:
      bulk:   { nsw: 120, ediffg: -8.0e-2, potim: 0.2 }
      slab:   { nsw: 120, ediffg: -8.0e-2, potim: 0.2 }
      static: { ediff: 1.0e-4 }
      freq:   { ediff: 1.0e-5 }

# System-dependent — DECIDE per job, do not blindly copy `common`:
#   ismear / sigma
#     metal slab           -> ismear 1,  sigma 0.1   (Methfessel-Paxton)
#     gas-phase molecule / -> ismear 0,  sigma 0.05  (Gaussian)
#       insulator
#   ispin / magmom
#     non-magnetic         -> ispin 1   (drop magmom)
#     magnetic (Fe/Co/Ni/  -> ispin 2 + magmom (per-atom initial moments;
#       Mn/Cr/...)              REQUIRED when ispin 2)
#   k-points
#     both actual calculation and screening use kspacing 0.30 (screening does not
#     coarsen k-points). Use an explicit vasp.kpts only when a fixed mesh is
#     needed (then omit kspacing/kgamma for that job).
#     gas-phase molecules in 20 20 21 Å cells -> vasp.kpts [1,1,1] and
#       vasp.gamma true; omit kspacing/kgamma.
#
# Gas-phase molecule relax/static/freq policy:
#   - build structures with build-gas-phase-models first.
#   - gas relaxation has no dedicated CLI task enum yet; omit `task` and write
#     explicit relax parameters.
#   - gas static uses task.static; gas frequency uses task.freq only after a
#     selected relaxed endpoint exists.
#   - do not infer charge or spin here; preserve explicit user values only.
