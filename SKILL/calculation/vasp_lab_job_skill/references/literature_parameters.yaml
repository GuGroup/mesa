# Add paper-derived VASP parameter profiles here.
#
# The scripts can load any profile in this file with:
#   python scripts/make_vasp_inputs.py ... --profile <profile_name> \
#       --parameters-yaml references/literature_parameters.yaml
#
# Rules for this file:
# - Do not add values without a paper/source note.
# - Include DOI, article title, or a clear citation string when possible.
# - Keep values system-specific. Do not reuse a Co/Ni oxide U value for an
#   unrelated oxide or metal without checking the paper context.
# - User overrides on the command line still win over these values.

profiles:
  example_paper_profile_do_not_use_until_filled:
    source:
      status: template_only
      citation: "REPLACE_WITH_FULL_CITATION"
      doi: "REPLACE_WITH_DOI"
      notes: "Fill this with the material/system, functional, U values, dispersion, k-point/ENCUT policy, and convergence criteria from the paper."
    vasp:
      # Example keys only. Delete or replace before use.
      xc: pbe
      encut: null
      kpts: null
      ismear: null
      sigma: null
